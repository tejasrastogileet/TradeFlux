version: '3.8'

services:

  prometheus:
    image: prom/prometheus
    container_name: tradeflux-prometheus

    ports:
      - "9090:9090"

    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

    restart: unless-stopped

  grafana:
    image: grafana/grafana

    container_name: tradeflux-grafana

    ports:
      - "3000:3000"

    restart: unless-stopped


  zipkin:
    image: openzipkin/zipkin

    container_name: tradeflux-zipkin

    ports:
      - "9411:9411"

    restart: unless-stopped