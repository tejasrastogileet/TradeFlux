apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: tradeflux

spec:
  replicas: 1

  selector:
    matchLabels:
      app: api-gateway

  template:
    metadata:
      labels:
        app: api-gateway

    spec:
      containers:
        - name: api-gateway

          image: yash01er/tradeflux-api-gateway:1.0

          imagePullPolicy: Always

          ports:
            - containerPort: 9090

          env:
            - name: SPRING_PROFILES_ACTIVE
              value: docker

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: tradeflux-secret
                  key: JWT_SECRET