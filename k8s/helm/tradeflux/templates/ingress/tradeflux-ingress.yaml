apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tradeflux-ingress
  namespace: tradeflux
spec:
  ingressClassName: nginx

  rules:
    - host: tradeflux.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 9090