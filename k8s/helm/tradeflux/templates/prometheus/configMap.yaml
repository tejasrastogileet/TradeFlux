apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: tradeflux

data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:

      - job_name: 'api-gateway'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['api-gateway:9090']

      - job_name: 'auth-service'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['auth-service:8081']

      - job_name: 'user-service'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['user-service:8082']

      - job_name: 'order-service'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['order-service:8083']

      - job_name: 'portfolio-service'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['portfolio-service:8084']

      - job_name: 'wallet-service'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['wallet-service:8085']

      - job_name: 'discovery-server'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['discovery-server:8761']