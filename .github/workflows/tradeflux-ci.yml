name: TradeFlux CI

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-and-push:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - auth-service
          - user-service
          - order-service
          - portfolio-service
          - wallet-service
          - api-gateway
          - discovery-server

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build Entire Project
        run: mvn clean package -DskipTests

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          ls -la services/${{ matrix.service }}
          ls -la services/${{ matrix.service }}/target

          docker build \
            -f services/${{ matrix.service }}/Dockerfile \
            -t yash01er/tradeflux-${{ matrix.service }}:latest \
            services/${{ matrix.service }}
          

      - name: Push Docker Image
        run: |
          docker push yash01er/tradeflux-${{ matrix.service }}:latest