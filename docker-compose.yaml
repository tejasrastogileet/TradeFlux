
services:
  postgres:
    image: postgres:15
    container_name: tradeflux-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    restart: unless-stopped
    networks:
      - tradeflux-network

  kafka:
    image: apache/kafka:3.7.0
    container_name: tradeflux-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CLUSTER_ID: tradeflux-kraft-cluster
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    restart: unless-stopped
    networks:
      - tradeflux-network

  zipkin:
    image: openzipkin/zipkin
    container_name: tradeflux-zipkin
    ports:
      - "9411:9411"
    restart: unless-stopped
    networks:
      - tradeflux-network

  discovery-server:
    image: tradeflux/discovery-server:1.0
    build:
      context: .
      dockerfile: services/discovery-server/Dockerfile
    container_name: discovery-server
    ports:
      - "8761:8761"
    depends_on:
      - postgres
      - kafka
      - zipkin
    restart: unless-stopped
    networks:
      - tradeflux-network

  auth-service:
    image: tradeflux/auth-service:1.0
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: auth-service
    ports:
      - "8086:8081"
    depends_on:
      - discovery-server
      - postgres
    restart: unless-stopped
    networks:
      - tradeflux-network

  user-service:
    image: tradeflux/user-service:1.0
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    container_name: user-service
    ports:
      - "8082:8082"
    depends_on:
      - discovery-server
      - postgres
    restart: unless-stopped
    networks:
      - tradeflux-network

  wallet-service:
    image: tradeflux/wallet-service:1.0
    build:
      context: .
      dockerfile: services/wallet-service/Dockerfile
    container_name: wallet-service
    ports:
      - "8085:8085"
    depends_on:
      - discovery-server
      - postgres
    restart: unless-stopped
    networks:
      - tradeflux-network

  portfolio-service:
    image: tradeflux/portfolio-service:1.0
    build:
      context: .
      dockerfile: services/portfolio-service/Dockerfile
    container_name: portfolio-service
    ports:
      - "8084:8084"
    depends_on:
      - discovery-server
      - postgres
    restart: unless-stopped
    networks:
      - tradeflux-network

  order-service:
    image: tradeflux/order-service:1.0
    build:
      context: .
      dockerfile: services/order-service/Dockerfile
    container_name: order-service
    ports:
      - "18081:8081"
    depends_on:
      - discovery-server
      - wallet-service
    restart: unless-stopped
    networks:
      - tradeflux-network

  api-gateway:
    image: tradeflux/api-gateway:1.0
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: api-gateway
    ports:
      - "7080:9090"
    depends_on:
      - auth-service
      - user-service
      - wallet-service
      - portfolio-service
      - order-service
    restart: unless-stopped
    networks:
      - tradeflux-network

volumes:
  postgres_data:

networks:
  tradeflux-network:
    driver: bridge
