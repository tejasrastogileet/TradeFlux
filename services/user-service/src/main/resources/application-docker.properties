spring.application.name=user-service

server.port=8082


spring.datasource.url=jdbc:postgresql://postgres:5432/tradeflux_user
spring.datasource.username=postgres
spring.datasource.password=yash8252
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

eureka.client.service-url.defaultZone=http://discovery-server:8761/eureka/
eureka.instance.prefer-ip-address=true

logging.level.root=INFO
logging.level.com.tradeflux=DEBUG
logging.level.org.springframework.kafka=INFO

spring.kafka.bootstrap-servers=kafka:9092

spring.kafka.consumer.group-id=user-service-group
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=com.tradeflux.events
spring.kafka.consumer.properties.spring.json.type.mapping=userRegisteredEvent:com.tradeflux.events.UserRegisteredEvent

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

management.prometheus.metrics.export.enabled=true

management.metrics.tags.application=${spring.application.name}


management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://tradeflux-zipkin:9411/api/v2/spans